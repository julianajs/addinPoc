<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitorar reunião</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Monitorar reunião</h1>
        </div>

        <div class="content">
            <div id="status-message" class="status-message"></div>

            <!-- Seção de Ação -->
            <div class="action-section">
                <h3>Monitorar Reunião</h3>
                <p>Ao clicar no botão abaixo, esta reunião será marcada como pública para monitoramento.</p>
                
                <button id="mark-public-button" class="btn-primary">
                    <span class="flag-icon">🚩</span>
                    Monitorar
                </button>
            </div>

            <!-- Seção de Resultado -->
            <div id="result-section" class="result-section hidden">
                <h3>Resultado da Operação</h3>
                <div id="result-message" class="result-message"></div>
                <button id="close-button" class="btn-secondary">Fechar</button>
            </div>

            <!-- Indicador de Carregamento -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Processando requisição...</p>
            </div>
        </div>
    </div>

    <script src="taskpane.js"></script>
</body>
</html>
