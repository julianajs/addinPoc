
<style>
  .preview-wrap {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-lg);
    padding: 20px;
    display: flex;
    align-items: flex-start;
    gap: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 420px;
  }
  .outlook-chrome {
    flex: 1;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md) 0 0 var(--border-radius-md);
    overflow: hidden;
    min-height: 380px;
  }
  .ol-toolbar {
    background: #1a3a6e;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ol-toolbar span {
    color: rgba(255,255,255,0.8);
    font-size: 11px;
  }
  .ol-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: background 0.15s;
  }
  .ol-btn:hover { background: rgba(255,255,255,0.25); }
  .ol-btn.active { background: rgba(255,255,255,0.3); outline: 1.5px solid rgba(255,255,255,0.5); }
  .ol-body {
    padding: 16px;
  }
  .ol-field { margin-bottom: 10px; }
  .ol-field label { font-size: 11px; color: var(--color-text-secondary); display: block; margin-bottom: 3px; }
  .ol-input {
    width: 100%;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 12px;
    font-family: 'Segoe UI', sans-serif;
    color: var(--color-text-primary);
    background: var(--color-background-primary);
  }
  .ol-tag {
    display: inline-block;
    background: #e8f6ed;
    color: #1a6e3a;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* Addin pane */
  .addin-pane {
    width: 220px;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-left: none;
    border-radius: 0 var(--border-radius-md) var(--border-radius-md) 0;
    overflow: hidden;
    min-height: 380px;
    display: flex;
    flex-direction: column;
  }
  .pane-header {
    background: #1a3a6e;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pane-header-icon {
    width: 22px; height: 22px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .pane-header h3 {
    color: #fff;
    font-size: 11px;
    font-weight: 600;
  }
  .pane-header p { color: rgba(255,255,255,0.7); font-size: 10px; margin-top: 1px; }

  .pane-body { padding: 12px; flex: 1; }

  /* Toggle card */
  .tcard {
    border: 1.5px solid var(--color-border-secondary);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }
  .tcard.yes { border-color: #1a6e3a; }
  .tcard.no  { border-color: #6e1a1a; }

  .trow {
    background: var(--color-background-secondary);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .trow-lbl {
    flex: 1;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-text-secondary);
  }
  .tw {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tw-txt {
    font-size: 10px;
    font-weight: 600;
    color: var(--color-text-secondary);
    min-width: 22px;
  }
  .tw-txt.on { color: var(--color-text-primary); }

  .sw {
    position: relative;
    width: 32px; height: 17px;
    cursor: pointer;
  }
  .sw input { opacity:0; width:0; height:0; }
  .sw-track {
    position: absolute;
    inset: 0;
    background: var(--color-border-secondary);
    border-radius: 17px;
    transition: background 0.2s;
  }
  .sw-thumb {
    position: absolute;
    width: 12px; height: 12px;
    left: 2.5px; top: 2.5px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }

  .tcard.yes .sw-track { background: #1a6e3a; }
  .tcard.yes .sw-thumb { transform: translateX(15px); }

  .tstatus {
    padding: 7px 10px;
    display: none;
    align-items: flex-start;
    gap: 6px;
  }
  .tstatus.v { display: flex; }
  .tstatus-yes { background: #e8f6ed; }
  .tstatus-no  { background: #f6e8e8; }
  .tdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink:0; margin-top: 3px; }
  .tdot-y { background: #1a6e3a; }
  .tdot-n { background: #6e1a1a; }
  .tstatus-text { font-size: 10px; line-height: 1.35; color: var(--color-text-secondary); }
  .tstatus-text strong { display: block; font-weight: 600; font-size: 10px; color: var(--color-text-primary); }

  /* esfera grid */
  .sec-lbl {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-secondary);
    margin-bottom: 5px;
  }
  .egrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-bottom: 10px;
  }
  .ebtn {
    border: 1px solid var(--color-border-tertiary);
    border-radius: 4px;
    padding: 5px 6px;
    font-size: 10px;
    cursor: pointer;
    font-family: 'Segoe UI', sans-serif;
    color: var(--color-text-secondary);
    background: var(--color-background-primary);
    transition: all 0.15s;
    line-height: 1.2;
  }
  .ebtn:hover { border-color: #2e5fa3; background: #e8edf6; }
  .ebtn.sel { border-color: #2e5fa3; background: #e8edf6; color: #1a3a6e; font-weight: 600; }
  .ebtn .ei { display: block; font-size: 13px; margin-bottom: 2px; }

  .notas {
    width: 100%;
    border: 1px solid var(--color-border-tertiary);
    border-radius: 4px;
    padding: 5px 7px;
    font-size: 10px;
    font-family: 'Segoe UI', sans-serif;
    color: var(--color-text-primary);
    background: var(--color-background-primary);
    resize: none;
    height: 40px;
    outline: none;
    margin-bottom: 10px;
  }

  .sbtn {
    width: 100%;
    background: #1a3a6e;
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 7px 10px;
    font-size: 11px;
    font-weight: 600;
    font-family: 'Segoe UI', sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }
  .sbtn:hover { background: #2e5fa3; }
  .sbtn.saved { background: #1a6e3a; }

  .gov-sec { display: none; }
  .gov-sec.v { display: block; }
</style>

<div class="preview-wrap">
  <div class="outlook-chrome">
    <div class="ol-toolbar">
      <button class="ol-btn" onclick="">Enviar</button>
      <button class="ol-btn" onclick="">Salvar</button>
      <span style="flex:1"></span>
      <button class="ol-btn active" onclick="togglePane()">🏛️ Poder Público</button>
      <button class="ol-btn">...</button>
    </div>
    <div class="ol-body">
      <div class="ol-field">
        <label>Assunto</label>
        <div class="ol-input" id="subjectDisplay" style="display:flex;align-items:center;">
          Reunião de Licitação — Q2
        </div>
      </div>
      <div class="ol-field">
        <label>Data e hora</label>
        <div class="ol-input">Qua, 07 Mai 2025 — 14h às 16h</div>
      </div>
      <div class="ol-field">
        <label>Participantes</label>
        <div class="ol-input" style="color:var(--color-text-secondary)">joao@empresa.com; maria@empresa.com</div>
      </div>
      <div class="ol-field" style="margin-top:14px;">
        <div style="font-size:11px;color:var(--color-text-secondary);padding:10px;border:0.5px dashed var(--color-border-tertiary);border-radius:4px;text-align:center;">
          Corpo da mensagem…
        </div>
      </div>
    </div>
  </div>

  <div class="addin-pane" id="addinPane">
    <div class="pane-header">
      <div class="pane-header-icon">🏛️</div>
      <div>
        <h3>Poder Público</h3>
        <p>Classificação de reunião</p>
      </div>
    </div>
    <div class="pane-body">

      <div class="tcard" id="tc">
        <div class="trow">
          <span class="trow-lbl">Participação do Poder Público?</span>
          <div class="tw">
            <span class="tw-txt on" id="lnao">NÃO</span>
            <label class="sw" onclick="toggleGov()">
              <input type="checkbox" id="gtog">
              <div class="sw-track" id="swTrack"></div>
              <div class="sw-thumb" id="swThumb"></div>
            </label>
            <span class="tw-txt" id="lsim">SIM</span>
          </div>
        </div>
        <div class="tstatus tstatus-yes" id="syes"></div>
        <div class="tstatus tstatus-no"  id="sno"></div>
      </div>

      <div class="gov-sec" id="govSec">
        <div class="sec-lbl">Esfera de governo</div>
        <div class="egrid">
          <button class="ebtn" onclick="selEsf(this,'federal')"><span class="ei">🏛️</span>Federal</button>
          <button class="ebtn" onclick="selEsf(this,'estadual')"><span class="ei">🗺️</span>Estadual</button>
          <button class="ebtn" onclick="selEsf(this,'municipal')"><span class="ei">🏙️</span>Municipal</button>
          <button class="ebtn" onclick="selEsf(this,'outros')"><span class="ei">🌐</span>Misto</button>
        </div>
        <div class="sec-lbl">Órgão / Observações</div>
        <textarea class="notas" placeholder="Ex.: Prefeitura, ANATEL…" id="notasTxt"></textarea>
      </div>

      <button class="sbtn" id="sbtn" onclick="salvarDemo()">💾 Salvar na Reunião</button>

    </div>
  </div>
</div>

<script>
  let isGov = false;
  let esfera = null;

  function togglePane() {}

  function toggleGov() {
    isGov = !isGov;
    const tc = document.getElementById('tc');
    const govSec = document.getElementById('govSec');
    const syes = document.getElementById('syes');
    const sno  = document.getElementById('sno');
    const lsim = document.getElementById('lsim');
    const lnao = document.getElementById('lnao');
    const swTrack = document.getElementById('swTrack');
    const swThumb = document.getElementById('swThumb');

    if (isGov) {
      tc.className = 'tcard yes';
      swTrack.style.background = '#1a6e3a';
      swThumb.style.transform = 'translateX(15px)';
      syes.className = 'tstatus tstatus-yes v';
      syes.innerHTML = '<div class="tdot tdot-y"></div><div class="tstatus-text"><strong>Reunião com Poder Público</strong>Envolve órgãos ou representantes governamentais.</div>';
      sno.className = 'tstatus tstatus-no';
      govSec.className = 'gov-sec v';
      lsim.className = 'tw-txt on';
      lnao.className = 'tw-txt';
    } else {
      tc.className = 'tcard no';
      swTrack.style.background = '';
      swThumb.style.transform = '';
      sno.className = 'tstatus tstatus-no v';
      sno.innerHTML = '<div class="tdot tdot-n"></div><div class="tstatus-text"><strong>Sem Poder Público</strong>Reunião sem participação governamental.</div>';
      syes.className = 'tstatus tstatus-yes';
      govSec.className = 'gov-sec';
      lsim.className = 'tw-txt';
      lnao.className = 'tw-txt on';
      esfera = null;
      document.querySelectorAll('.ebtn').forEach(b => b.classList.remove('sel'));
      document.getElementById('sbtn').className = 'sbtn';
      document.getElementById('subjectDisplay').innerHTML = 'Reunião de Licitação — Q2';
    }
  }

  function selEsf(btn, val) {
    document.querySelectorAll('.ebtn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    esfera = val;
  }

  function salvarDemo() {
    const btn = document.getElementById('sbtn');
    const subj = document.getElementById('subjectDisplay');
    btn.textContent = '✓ Salvo!';
    btn.className = 'sbtn saved';
    if (isGov) {
      subj.innerHTML = '<span style="background:#e8f6ed;color:#1a6e3a;font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;margin-right:5px;">[GOV]</span>Reunião de Licitação — Q2';
    }
    setTimeout(() => {
      btn.textContent = '💾 Salvar na Reunião';
      btn.className = 'sbtn';
    }, 2000);
  }
</script>
